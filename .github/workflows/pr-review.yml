# PR 을 채점해 점수 코멘트를 남기고, 70점 미만이면 실패한다.
#
# check.yml 은 기계가 판정할 수 있는 것(lint · build · test)을 본다. 여기는 그 밖이다 —
# 보안 · 범위 · 깨지는 동작 · 테스트 · 이행을 pr-reviewer 에이전트가 100점 만점으로 채점한다.
#   채점표    plugins/sheetview-kit/agents/pr-reviewer.md
#   합산·판정 .github/scripts/pr-review-gate.sh   (80 미만 경고 · 70 미만 실패)
#
# 공식 액션(anthropics/claude-code-action) 대신 CLI 를 직접 부른다. 같은 명령을 로컬에서
# 그대로 돌려 볼 수 있어서, 에이전트나 스키마를 고쳤을 때 푸시하기 전에 확인할 수 있다.
#
# main 의 브랜치 보호가 이 잡(pr-review)을 필수 체크로 건다. 그래서:
#  - **워크플로 수준 paths 필터를 쓰지 않는다.** 필수 체크는 워크플로가 아예 돌지 않으면
#    영원히 대기 상태로 남아, 문서만 고친 PR 이 머지되지 않는다. 잡은 항상 돌고 스텝이 가른다.
#  - 잡 이름을 바꾸면 브랜치 보호의 체크 이름도 같이 바꿔야 한다.
name: pr-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# 같은 PR 에 연속으로 밀면 앞의 채점은 취소한다. 낡은 커밋의 점수는 쓸 데가 없다.
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-review:
    # draft 와 포크 PR 은 건너뛴다. 건너뛴 필수 체크는 통과로 친다.
    # 공개 저장소에서 포크 PR 에는 시크릿이 전달되지 않아 채점할 수 없다 — 포크 PR 은 사람이 본다.
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      # 머지 커밋이 아니라 PR head 를 받는다. 보고의 `파일:줄` 이 PR 에서 보이는 줄과 맞아야 한다.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # 코드나 게이트를 건드린 PR 만 채점한다. 문서만 고친 PR 은 여기서 끝나고 잡은 통과한다.
      # 게이트(래칫 파일 · check.sh · 훅 · 워크플로 · 채점표)가 대상인 이유: 채점표의 Scope 가 게이트 완화를
      # 🔴 로 잡는데, 이 필터가 그 경로를 빼면 완화만 한 PR 이 채점 없이 통과한다.
      - name: 코드 PR 인가
        id: scope
        run: |
          files=$(gh pr diff "$PR" --name-only)
          if printf '%s\n' "$files" | grep -qE '^(src/|gradle/|build\.gradle\.kts$|settings\.gradle\.kts$|gradle\.properties$|scripts/check\.sh$|\.claude/tdd-|\.github/|plugins/sheetview-kit/(agents/pr-reviewer\.md$|hooks/|scripts/))'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "코드 변경이 없어 채점하지 않습니다."
          fi

      # 채점자(에이전트 · 스키마 · 게이트 스크립트)는 PR head 가 아니라 base 에서 가져온다.
      # head 의 것을 쓰면 채점표를 고친 PR 이 고친 채점표로 자기를 통과시킨다. 그래서 리뷰어를 고친 PR 은
      # 고치기 전 리뷰어가 채점한다 — 고친 리뷰어는 푸시하기 전에 로컬에서 같은 명령으로 돌려 본다.
      # 작업 트리 밖에 풀어서 리뷰 대상에 섞이지 않게 한다.
      # 이 워크플로 파일 자체는 `pull_request` 트리거라 여전히 PR 의 것이 돈다. 여기까지 막지는 못한다.
      - name: 채점자를 base 에서 가져온다
        if: steps.scope.outputs.code == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          mkdir -p "$RUNNER_TEMP/base"
          git archive "$BASE_SHA" plugins/sheetview-kit .github/scripts | tar -x -C "$RUNNER_TEMP/base"

      - name: Claude Code 설치
        if: steps.scope.outputs.code == 'true'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: pr-reviewer 채점
        if: steps.scope.outputs.code == 'true'
        # 채점이 실패해도 잡을 여기서 끝내지 않는다. 다음 스텝이 "돌리지 못했다"는 코멘트를 남긴다.
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PROMPT: |
            저장소 ${{ github.repository }} 의 PR #${{ github.event.pull_request.number }} 을 채점한다.
            - 작업 트리는 이 PR 의 head 다. 제목과 설명은 `gh pr view ${{ github.event.pull_request.number }}`, 변경분은 `gh pr diff ${{ github.event.pull_request.number }}` 로 읽는다.
            - 자동 검사(lint · build · test · verifyPlugin)는 check 워크플로가 따로 돌린다. gradle 을 돌리지 않는다.
            - 결과는 구조화 출력으로만 낸다. GitHub 에 코멘트를 직접 달지 않는다 — 다음 스텝이 단다.
        # dontAsk: 아래 허용 목록과 읽기 전용 명령 말고는 전부 거절한다. 물어볼 사람이 없다.
        run: |
          claude -p "$PROMPT" \
            --plugin-dir "$RUNNER_TEMP/base/plugins/sheetview-kit" \
            --agent sheetview-kit:pr-reviewer \
            --permission-mode dontAsk \
            --allowedTools "Bash(gh pr view *)" "Bash(gh pr diff *)" "Bash(git diff *)" "Bash(git log *)" "Bash(git show *)" \
            --json-schema "$(cat "$RUNNER_TEMP/base/.github/scripts/pr-review-schema.json")" \
            --output-format json > "$RUNNER_TEMP/review.json"

      # 코멘트는 PR 당 하나를 갱신한다. 푸시마다 새로 달면 낡은 점수가 쌓인다.
      - name: 점수 판정 · 코멘트
        if: steps.scope.outputs.code == 'true'
        run: |
          result=$(jq -c '.structured_output // empty' "$RUNNER_TEMP/review.json" 2>/dev/null || true)
          if [ -z "$result" ]; then
            echo "::warning::pr-reviewer 가 점수를 내지 못했습니다."
            jq -r '.result // empty' "$RUNNER_TEMP/review.json" 2>/dev/null | head -c 2000 || true
          fi

          code=0
          printf '%s' "$result" | sh "$RUNNER_TEMP/base/.github/scripts/pr-review-gate.sh" "$RUNNER_TEMP/comment.md" || code=$?

          id=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- pr-reviewer -->")) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
          else
            gh pr comment "$PR" --body-file "$RUNNER_TEMP/comment.md"
          fi
          exit "$code"
