# 플랫폼 262 클래스는 Java 25 바이트코드(major 69)라 JDK 25로 컴파일해야 한다.
# 로컬에 JDK 25가 없으면 settings.gradle.kts 의 foojay 리졸버가 자동으로 내려받는다.
#
# 이미 설치된 JetBrains IDE의 번들 JBR은 javac 25를 포함한 완전한 JDK이므로 그걸 재사용하면
# 다운로드가 없다. 경로는 사람마다 다르므로 저장소가 아니라 ~/.gradle/gradle.properties 에 둔다:
#
#   org.gradle.java.installations.paths=/경로/WebStorm.app/Contents/jbr/Contents/Home
#   localIdePath=/경로/WebStorm.app
#   verifyIdePaths=/경로/WebStorm.app,/Applications/IntelliJ IDEA.app
#
# localIdePath  - 플랫폼 의존성으로 쓸 로컬 IDE. 비면 원격 아티팩트(~1GB)를 받는다.
# verifyIdePaths - verifyPlugin 이 호환성을 검증할 IDE 목록(쉼표 구분). 비면 권장 조합을 받는다.
localIdePath=
verifyIdePaths=

org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
org.gradle.caching=true
# 플랫폼이 kotlin-stdlib를 번들하므로 중복 적재를 막는다.
kotlin.stdlib.default.dependency=false
