<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" fill="none">
    <!-- 2px transparent margin -->
    <rect x="3" y="3" width="34" height="34" rx="4" fill="#217346"/>
    <!-- header bar -->
    <rect x="5" y="5" width="30" height="7" rx="1.5" fill="#1a5c38"/>
    <!-- grid lines (white, subtle) -->
    <g stroke="#ffffff" stroke-width="1" stroke-opacity="0.85">
        <!-- horizontal -->
        <line x1="5" y1="16" x2="35" y2="16"/>
        <line x1="5" y1="23" x2="35" y2="23"/>
        <line x1="5" y1="30" x2="35" y2="30"/>
        <!-- vertical -->
        <line x1="12" y1="12" x2="12" y2="35"/>
        <line x1="20" y1="12" x2="20" y2="35"/>
        <line x1="28" y1="12" x2="28" y2="35"/>
    </g>
    <!-- accent cells (data feel) -->
    <rect x="6" y="13" width="5" height="2.5" rx="0.5" fill="#ffffff" fill-opacity="0.9"/>
    <rect x="13.5" y="17.5" width="5.5" height="4" rx="0.5" fill="#a9d08e" fill-opacity="0.95"/>
    <rect x="21.5" y="24.5" width="5.5" height="4" rx="0.5" fill="#a9d08e" fill-opacity="0.95"/>
    <rect x="29.5" y="17.5" width="4.5" height="4" rx="0.5" fill="#ffffff" fill-opacity="0.7"/>
</svg>